[project]
name = "data-dags"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dom Jina", email = "dominicjina@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "apache-airflow>=3.3.1",
    "apache-airflow-providers-amazon>=9.37.0",
    "apache-airflow-providers-postgres>=7.0.2",
    "boto3>=1.43.108",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pendulum>=3.2.0",
    "pgsql>=2.2",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ruff",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
